<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIER×DREI — das tägliche Worträtsel</title>
<meta name="description" content="Vier Kategorien. Drei Wörter je Kategorie. Ein Wort steht in allen vier. Jeden Tag ein neues deutsches Rätsel.">
<meta name="theme-color" content="#12243B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#12243B; --ground-2:#0B1726; --rule:#26405E;
  --card:#F2EDE3; --card-edge:#D6CDBC; --ink:#101820; --ink-soft:#4A5766;
  --paper-dim:#B9AF9C;
  --brass:#D9A441;
  --t1:#F2B705; --t2:#2F9E62; --t3:#2D74C4; --t4:#8558C4;
  --gap:10px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --disp:"Oswald",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  background-image:radial-gradient(120% 80% at 50% -10%, #1B3555 0%, var(--ground) 55%, var(--ground-2) 100%);
  background-attachment:fixed;
  color:var(--card); font-family:var(--sans);
  min-height:100svh; display:flex; flex-direction:column; align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1}

/* ---------- Kopf ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 8px}
.mark{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:.10em;line-height:1;
  color:var(--card);display:flex;align-items:baseline;gap:.12em}
.mark .x{color:var(--brass);font-size:.8em;transform:translateY(-.04em)}
.tools{display:flex;gap:6px}
.tool{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:#16294180;
  color:var(--card);font-size:15px;display:grid;place-items:center;cursor:pointer;font-family:var(--sans)}
.tool:hover{background:#1E3A5A}
.tool:focus-visible,.btn:focus-visible,.card:focus-visible,.linkish:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tagline{font-size:12.5px;color:#9FB3C9;letter-spacing:.01em;margin:0 0 12px;line-height:1.45}

/* ---------- Statusleiste ---------- */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 2px;margin-bottom:12px}
.status .left{display:flex;align-items:center;gap:10px}
.pill{font-family:var(--mono);font-size:11px;color:#9FB3C9;letter-spacing:.04em}
.pill b{color:var(--card);font-weight:600}
.modes{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.modes button{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:#9FB3C9;border:0;padding:5px 9px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--brass);color:#1A1204;font-weight:600}

/* ---------- Gelöste Kategorien ---------- */
#geloest{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--gap)}
.plaque{border-radius:9px;padding:7px 11px;display:flex;align-items:center;gap:8px;
  box-shadow:inset 0 0 0 1px #0000001f, 0 1px 0 #ffffff40 inset;animation:drop .32s cubic-bezier(.2,.9,.3,1.2)}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;background:#00000033;border-radius:4px;padding:1px 5px}
.plaque .titel{font-family:var(--disp);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Raster ---------- */
#raster{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;margin-bottom:14px}
.card{
  position:relative; flex:0 0 calc((100% - 2*var(--gap))/3);
  aspect-ratio:1/.64; min-height:60px;
  border:0;border-radius:10px; background:var(--card); color:var(--ink);
  font-family:var(--disp); font-weight:500; letter-spacing:.03em;
  font-size:clamp(11px,3.6vw,17px); line-height:1.1;
  display:grid;place-items:center;text-align:center;padding:6px 5px;cursor:pointer;
  box-shadow:0 2px 0 var(--card-edge), 0 6px 14px #00000038;
  transition:transform .13s ease, box-shadow .13s ease, background .13s ease;
  word-break:break-word;hyphens:auto;
}
.card span{display:block;max-width:100%}
.card:active{transform:translateY(1px)}
.card[aria-pressed="true"]{background:#2A3E57;color:var(--card);box-shadow:0 0 0 2px var(--brass), 0 6px 14px #00000038;transform:translateY(-2px)}
.card.hub::before{
  content:"";position:absolute;inset:-3px;border-radius:12px;padding:3px;
  background:var(--ring,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none;
}
.card.fest{cursor:default;box-shadow:inset 0 0 0 1px #00000026}
.card.fest:active{transform:none}
.card .num{position:absolute;top:4px;left:6px;font-family:var(--mono);font-size:9px;font-weight:600;opacity:.55}
.card.frisch{animation:einfaerben .34s cubic-bezier(.2,.9,.3,1.2)}
@keyframes einfaerben{from{transform:scale(.9)}to{transform:none}}
#raster.wrong{animation:shake .34s}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}

/* ---------- Bedienung ---------- */
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:13px;letter-spacing:.02em;padding:10px 15px;border-radius:9px;
  border:1px solid var(--rule);background:#16294180;color:var(--card);cursor:pointer;min-height:42px}
.btn:hover:not(:disabled){background:#1E3A5A}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1A1204;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.msg{min-height:20px;text-align:center;font-size:13px;color:var(--brass);letter-spacing:.02em;margin-bottom:6px}

/* ---------- Fußzeile ---------- */
footer{margin-top:auto;padding-top:16px;text-align:center;font-size:11.5px;color:#7E93AA;line-height:1.7}
.linkish{background:none;border:0;color:#9FB3C9;text-decoration:underline;cursor:pointer;font:inherit;padding:2px 4px}

/* ---------- Überlagerung ---------- */
.sheet{position:fixed;inset:0;background:#060D16D9;display:none;align-items:flex-end;justify-content:center;z-index:50;
  padding:0;backdrop-filter:blur(3px)}
.sheet.open{display:flex}
.sheet .panel{background:var(--ground);border:1px solid var(--rule);border-bottom:0;
  border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:88svh;overflow:auto;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.panel h2{font-family:var(--disp);font-weight:500;font-size:19px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 4px}
.panel h3{font-family:var(--disp);font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass);margin:18px 0 6px}
.panel p,.panel li{font-size:13.5px;line-height:1.62;color:#C9D6E4}
.panel ul{margin:6px 0;padding-left:18px}
.panel{position:relative}
.close{position:absolute;top:14px;right:14px;z-index:2}
.panel h2{padding-right:44px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;text-align:center}
.stats div b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;color:var(--card)}
.stats div span{font-size:10.5px;color:#93A7BC;letter-spacing:.04em}
table.score{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
table.score td{padding:5px 0;border-bottom:1px solid #ffffff12;color:#C9D6E4}
table.score td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
table.score tr.total td{border-bottom:0;border-top:1px solid var(--rule);font-weight:600;color:var(--card);padding-top:9px}
table.score td.minus:last-child{color:#F08A7A}
.emojigrid{font-size:22px;letter-spacing:3px;text-align:center;margin:10px 0 4px}
.archiv{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.archiv button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  background:#16294180;border:1px solid var(--rule);border-radius:9px;padding:11px 13px;color:var(--card);
  cursor:pointer;font:inherit;font-size:13.5px;text-align:left}
.archiv button:hover{background:#1E3A5A}
.archiv .done{color:var(--t2);font-family:var(--mono);font-size:12px}
.archiv .open{color:#7E93AA;font-family:var(--mono);font-size:12px}
.burst{position:fixed;pointer-events:none;font-size:26px;z-index:60;animation:fly .9s ease-out forwards}
@keyframes fly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.5)}}
.hint{font-size:12px;color:#93A7BC;margin-top:10px;font-style:italic}
/* ---------- Startbildschirm ---------- */
#start{position:fixed;inset:0;z-index:70;background:var(--ground);
  background-image:radial-gradient(120% 80% at 50% -10%,#1B3555 0%,var(--ground) 55%,var(--ground-2) 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
#start.open{display:flex}
#start .mark{font-size:34px;margin-bottom:2px}
#start p{font-size:13.5px;color:#9FB3C9;margin:0 0 10px;text-align:center;max-width:340px;line-height:1.6}
.weltwahl{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.weltwahl button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:#16294180;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;color:var(--card);font:inherit}
.weltwahl button:hover{background:#1E3A5A}
.weltwahl button[aria-current="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.weltwahl .icon{font-size:34px;line-height:1}
.weltwahl .titel{font-family:var(--disp);font-weight:500;font-size:17px;letter-spacing:.09em;text-transform:uppercase}
.weltwahl .unter{font-size:12.5px;color:#9FB3C9;line-height:1.5;margin-top:2px}

/* ---------- Kinderwelt ---------- */
body.kinder{--ground:#173A52;--ground-2:#0D2637;--rule:#2C5570;--brass:#FFC93C}
body.kinder{background-image:radial-gradient(120% 80% at 50% -10%,#22536F 0%,var(--ground) 55%,var(--ground-2) 100%)}
body.kinder .card{aspect-ratio:1/.78;min-height:74px;font-size:clamp(9.5px,3vw,13px);letter-spacing:.02em}
body.kinder .tagline{font-size:13.5px;color:#BBD2E2}
body.kinder .plaque .titel{font-size:15px}
body.kinder .btn{font-size:14px}
.card .bild{display:block;font-style:normal;font-size:clamp(19px,6.2vw,27px);line-height:1.15;margin-bottom:2px}
.sterne{font-size:30px;letter-spacing:6px;text-align:center;margin:6px 0 2px}

@media (prefers-reduced-motion:reduce){
  *,*::before{animation-duration:.001s!important;transition-duration:.001s!important}
}
@media (max-width:360px){ .card{font-size:11px} .mark{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">VIER<span class="x">×</span>DREI</div>
    <div class="tools">

      <span class="icon">🧒</span>

    </button>
    <button data-welt="erwachsen">
      <span class="icon">🧑</span>
      <span><span class="titel">Erwachsene</span><span class="unter">Neun Karten ohne Bilder, Uhr, Punkte und Serie.</span></span>
    </button>
  </div>
</div>

<!-- ===================== Blätter ===================== -->
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="puzzles.js"></script>
<script src="puzzles-kinder.js"></script>
<script>
"use strict";
(function(){

/* ---------------- Konstanten ---------------- */
var TIER = [
  {farbe:"#F2B705", schrift:"#0D1218", emoji:"🟨", name:"Stufe 1"},
  {farbe:"#2F9E62", schrift:"#07130C", emoji:"🟩", name:"Stufe 2"},
  // Blau und Lila sind zu dunkel für schwarze Schrift — helle Schrift hält
  // den Kontrast über 4.5:1, damit die Stufe nicht nur an der Farbe hängt.
  {farbe:"#2D74C4", schrift:"#FFFFFF", emoji:"🟦", name:"Stufe 3"},
  {farbe:"#8558C4", schrift:"#FFFFFF", emoji:"🟪", name:"Stufe 4"}
];
var PUNKTE = {
  loesung:100, schnell90:25, schnell180:10, lilaZuerst:25,
  fehler:-15, fehlerSpaet:-30, nabelZuletzt:-100
};
var TAG0 = Date.UTC(2026,0,1)/86400000;
/* Zwei Welten, eine Maschine. "kinder" hat drei Kategorien statt vier, Bilder
 * auf den Karten, keine Uhr und keine Punkte. Alles andere ist identisch. */
var welt = null;
function katalog(){ return welt==="kinder" ? window.VMD_KINDER : window.VMD_PUZZLES; }
function ns(){ return welt==="kinder" ? "vmd.kinder." : "vmd."; }
function anzahlGruppen(){ return S ? S.raetsel.gruppen.length : 4; }
var LS = {
  hol:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  setz:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ---------------- Hilfsfunktionen ---------------- */
function $(id){ return document.getElementById(id); }
function heutigeNr(){
  var d=new Date();
  return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000) - TAG0 + 1;
}
function datumVonNr(nr){
  var ms=(TAG0+nr-1)*86400000, d=new Date(ms);
  return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."+d.getUTCFullYear();
}
function raetselVonNr(nr){
  if(nr===0 && gastRaetsel) return gastRaetsel;
  var p=katalog();
  return p[((nr-1)%p.length+p.length)%p.length];
}
/* Direktlink aus build.html: #p=<base64url(json)>. Nr. 0 = Gastrunde,
 * zählt nicht in die Statistik und überschreibt das Tagesrätsel nicht. */
var gastRaetsel=null;
(function(){
  var m=/^#p=(.+)$/.exec(location.hash||"");
  if(!m) return;
  try{
    var s=m[1].replace(/-/g,"+").replace(/_/g,"/");
    var r=JSON.parse(decodeURIComponent(escape(atob(s))));
    if(r&&r.nabel&&r.gruppen&&r.gruppen.length===4) gastRaetsel=r;
  }catch(e){}
})();
function alleWoerter(r){
  var w=[r.nabel];
  r.gruppen.forEach(function(g){ w=w.concat(g.woerter); });
  return w;
}
function zeit(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function mische(a,seed){
  var arr=a.slice(), s=seed||Math.floor(Math.random()*1e9);
  function rnd(){ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* ---------------- Zustand ---------------- */
var S = null;          // laufendes Spiel
var opt = LS.hol("vmd.opt",{modus:"schwer",ton:true});
if(opt.ton===undefined) opt.ton=true;

function schluessel(nr){ return ns()+"spiel."+nr; }

function neuesSpiel(nr){
  var r=raetselVonNr(nr);
  var gespeichert = nr===0 ? null : LS.hol(schluessel(nr),null);
  if(gespeichert && gespeichert.reihenfolge){
    S=gespeichert; S.raetsel=r; S.nr=nr;
    if(!S.fertig) S.startMs=Date.now()-(S.sekunden||0)*1000;
    return;
  }
  S={
    nr:nr, welt:welt, raetsel:r,
    reihenfolge:mische(alleWoerter(r), nr*7919),
    geloest:[],            // Indizes der Gruppen in Lösungsreihenfolge
    versuche:[],           // "t0".."t3" bei Treffer, "x" bei Fehler
    fehler:0, sekunden:0, startMs:Date.now(),
    nabelZuletztZaehler:0, fertig:false, punkte:null,
    modus: welt==="kinder" ? "schwer" : opt.modus
  };
  // Nicht sofort speichern: ein unberührtes Spiel schreibt sonst beim Booten in
  // beide Welten. Die Kartenreihenfolge ist aus der Nummer abgeleitet und
  // entsteht beim nächsten Öffnen identisch neu.
}
function sichere(){
  if(!S || S.nr===0) return;   // Gastrunde aus einem Direktlink bleibt flüchtig
  var kopie={};
  for(var k in S) if(k!=="raetsel"&&k!=="startMs") kopie[k]=S[k];
  LS.setz(schluessel(S.nr),kopie);
}

/* ---------------- Statistik ---------------- */
function statsHol(){ return LS.hol(ns()+"stats",{gespielt:0,serie:0,maxSerie:0,letzteNr:0,punkte:0}); }
function statsSchreib(nr,punkte){
  var st=statsHol();
  if(nr===0) return st;                        // Direktlink zählt nicht
  if(st.letzteNr===nr) return st;              // pro Rätsel nur einmal zählen
  st.gespielt++;
  st.serie = (st.letzteNr===nr-1)?st.serie+1:1;
  if(st.serie>st.maxSerie) st.maxSerie=st.serie;
  st.letzteNr=nr; st.punkte+=punkte;
  LS.setz(ns()+"stats",st); return st;
}
function serieJetzt(nr){
  var st=statsHol();
  if(nr===0) return 0;
  if(st.letzteNr===nr) return st.serie;
  if(st.letzteNr===nr-1) return st.serie+1;
  return 1;
}

/* ---------------- Auswahl ---------------- */
var sel=[];   // geordnete Wortliste

function offeneGruppen(){
  var o=[];
  for(var i=0;i<S.raetsel.gruppen.length;i++) if(S.geloest.indexOf(i)<0) o.push(i);
  return o;
}
/* Alle neun Karten bleiben liegen. Gelöste Nebenwörter werden eingefärbt und
 * festgesetzt; das Nabelwort bleibt spielbar, bis alle vier Gruppen stehen. */
function festeWoerter(){
  var m={};
  S.geloest.forEach(function(gi){ S.raetsel.gruppen[gi].woerter.forEach(function(w){ m[w]=gi; }); });
  return m;
}
function istFest(w){ return w!==S.raetsel.nabel && festeWoerter().hasOwnProperty(w); }

/* ---------------- Zeichnen ---------------- */
function ringGradient(){
  // Ein Segment je Kategorie — vier Viertel bei Erwachsenen, drei Drittel bei
  // Kindern. Das erste Segment sitzt oben mittig.
  var n=anzahlGruppen(), schritt=360/n, teile=[], grad=0, i;
  for(i=0;i<n;i++){
    var farbe = i<S.geloest.length ? TIER[S.geloest[i]].farbe : "#D9A44133";
    teile.push(farbe+" "+grad+"deg "+(grad+schritt)+"deg"); grad+=schritt;
  }
  return "conic-gradient(from "+(-schritt/2)+"deg,"+teile.join(",")+")";
}

function zeichne(){
  // Kopf
  var kind = S.welt==="kinder";
  $("nr").textContent = S.nr===0 ? "Direktlink" : "Nr. "+S.nr;
  // Kinder spielen ohne Uhr, ohne Fehlerzähler und ohne Schwierigkeitswahl —
  // das sind Druckmittel, die hier nichts verbessern.
  $("uhr").style.display = kind ? "none" : "";
  $("fehler").innerHTML = (!kind && S.fehler) ? "Fehler <b>"+S.fehler+"</b>" : "";
  $("modeLeicht").parentNode.style.display = kind ? "none" : "";
  $("btnPunkte").style.display = kind ? "none" : "";
  $("btnTon").style.display = kind ? "" : "none";
  $("btnTon").textContent = opt.ton ? "🔊" : "🔇";
  $("btnWelt").textContent = kind ? "🧒" : "🧑";
  $("modeLeicht").setAttribute("aria-pressed", S.modus==="leicht");
  $("modeSchwer").setAttribute("aria-pressed", S.modus==="schwer");
  $("tagline").innerHTML = kind
    ? "Vier Gruppen. Drei Karten je Gruppe. <b>Ein Wort passt überall.</b>"
    : "Vier Kategorien. Drei Wörter je Kategorie. <b>Ein Wort steht in allen vier.</b>";

  // gelöste Plaketten
  var g=$("geloest"); g.innerHTML="";
  S.geloest.forEach(function(gi){
    var gr=S.raetsel.gruppen[gi], t=TIER[gi];
    var el=document.createElement("div");
    el.className="plaque"; el.style.background=t.farbe; el.style.color=t.schrift;
    el.innerHTML='<span class="chip">'+(gi+1)+'</span><span class="titel"></span>';
    el.querySelector(".titel").textContent=gr.titel;
    g.appendChild(el);
  });

  // Raster — immer neun Karten
  var r=$("raster"); r.innerHTML="";
  var fest=festeWoerter();
  // Das Nabelwort wird erst ab der zweiten gelösten Gruppe markiert. Nach der
  // ersten trägt es die Farbe dieser Gruppe und sieht aus wie jede andere
  // gelöste Karte — verrät sich also nicht.
  var zeigeNabel = S.modus==="leicht" || S.geloest.length>=2 || S.fertig;
  S.reihenfolge.forEach(function(w){
    var nabel = w===S.raetsel.nabel, gi = nabel ? (S.geloest.length?S.geloest[0]:-1) : (fest.hasOwnProperty(w)?fest[w]:-1);
    var markiert = nabel && zeigeNabel;
    var b=document.createElement("button");
    b.type="button";
    b.className="card"+(markiert?" hub":"")+(!nabel&&gi>=0?" fest":"");
    var bild = S.raetsel.bilder && S.raetsel.bilder[w];
    b.innerHTML=(bild?'<i class="bild"></i>':"")+"<span></span>";
    if(bild) b.querySelector(".bild").textContent=bild;
    b.querySelector("span").textContent=w;
    var gewaehlt = sel.indexOf(w)>=0;
    if(gi>=0 && !markiert){
      if(!gewaehlt){ b.style.background=TIER[gi].farbe; b.style.color=TIER[gi].schrift; }
      var n=document.createElement("i"); n.className="num"; n.textContent=gi+1;
      b.appendChild(n);
    }
    if(markiert) b.style.setProperty("--ring", ringGradient());
    if(!nabel && gi>=0){
      b.disabled=true; b.setAttribute("aria-label", w+" — gelöst, Stufe "+(gi+1));
    }else{
      b.setAttribute("aria-pressed", gewaehlt);
      b.addEventListener("click",function(){ tippe(w); });
    }
    r.appendChild(b);
  });

  // Knöpfe
  $("btnLeeren").disabled = sel.length===0 || S.fertig;
  $("btnPruefen").disabled = sel.length!==3 || S.fertig;
  $("btnMischen").disabled = S.fertig;
  uhrZeichne();
}

function uhrZeichne(){
  if(S.fertig){ $("uhr").textContent=zeit(S.sekunden); return; }
  S.sekunden=Math.floor((Date.now()-S.startMs)/1000);
  $("uhr").textContent=zeit(S.sekunden);
}
setInterval(function(){ if(S&&!S.fertig) uhrZeichne(); },1000);

function sag(text){ $("msg").textContent=text||""; }

/* ---------------- Spielzüge ---------------- */
function tippe(w){
  if(S.fertig||istFest(w)) return;
  var i=sel.indexOf(w);
  if(i>=0) sel.splice(i,1);
  else { if(sel.length===3) return; sel.push(w); sprich(w); }
  zeichne(); sag("");
}
/* Vorlesen ist die eigentliche Hilfe für Kinder, die noch nicht sicher lesen:
 * Bild sehen, antippen, Wort hören. Fehlt die Sprachausgabe, passiert nichts. */
function sprich(w){
  if(welt!=="kinder" || !opt.ton) return;
  try{
    var u=new SpeechSynthesisUtterance(w);
    u.lang="de-DE"; u.rate=0.8;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}

function pruefe(){
  if(sel.length!==3||S.fertig) return;
  var nabel=S.raetsel.nabel;
  var treffer=-1;
  offeneGruppen().forEach(function(gi){
    var soll=[nabel].concat(S.raetsel.gruppen[gi].woerter);
    if(sel.every(function(w){ return soll.indexOf(w)>=0; })) treffer=gi;
  });

  if(treffer>=0){
    if(sel[2]===nabel) S.nabelZuletztZaehler++;
    S.versuche.push("t"+treffer);
    S.geloest.push(treffer);
    sel=[];
    zeichne(); sichere();
    if(S.geloest.length===anzahlGruppen()-1){ setTimeout(letzteAufloesen,420); }
    else if(S.geloest.length===anzahlGruppen()){ setTimeout(gewonnen,420); }
    else if(S.geloest.length===1 && S.modus==="schwer")
      sag(S.raetsel.gruppen[treffer].titel+" — eins dieser drei geht weiter.");
    else sag(S.raetsel.gruppen[treffer].titel);
    return;
  }

  // Fehlversuch
  S.versuche.push("x");
  S.fehler++;
  var r=$("raster"); r.classList.remove("wrong"); void r.offsetWidth; r.classList.add("wrong");
  if(navigator.vibrate) navigator.vibrate(35);

  var fast=false;
  offeneGruppen().forEach(function(gi){
    var soll=[nabel].concat(S.raetsel.gruppen[gi].woerter);
    var n=sel.filter(function(w){ return soll.indexOf(w)>=0; }).length;
    if(n===2) fast=true;
  });
  if(S.welt==="kinder"){
    if(sel.indexOf(nabel)<0 && S.geloest.length>=2) sag("Das Wort mit dem goldenen Rand gehört immer dazu.");
    else if(fast) sag("Fast! Zwei davon passen zusammen.");
    else sag("Noch nicht. Probier eine andere Karte.");
  }
  else if(sel.indexOf(nabel)<0 && S.geloest.length>0) sag("Das Nabelwort fehlt in der Auswahl.");
  else if(fast) sag("Fast — zwei davon gehören zusammen.");
  else sag("Nicht diese drei.");
  sichere(); zeichne();
}

function letzteAufloesen(){
  var rest=offeneGruppen()[0];
  S.versuche.push("t"+rest);
  S.geloest.push(rest);
  sel=[]; zeichne(); sichere();
  setTimeout(gewonnen,420);
}

function gewonnen(){
  S.fertig=true;
  S.sekunden=Math.floor((Date.now()-S.startMs)/1000);
  var kind=S.welt==="kinder";
  var p = kind ? {zeilen:[],summe:0,serie:serieJetzt(S.nr)} : rechnePunkte();
  S.punkte=p.summe;
  var st=statsSchreib(S.nr,p.summe);
  sichere(); zeichne();
  if(kind) zeigeErgebnisKinder(st); else zeigeErgebnis(p,st);
}

function rechnePunkte(){
  var zeilen=[], summe=0;
  function add(text,wert,minus){ if(wert===0) return; zeilen.push({text:text,wert:wert,minus:!!minus}); summe+=wert; }
  add("Rätsel gelöst", PUNKTE.loesung);
  if(S.sekunden<90) add("Unter 90 Sekunden", PUNKTE.schnell90);
  else if(S.sekunden<180) add("Unter 3 Minuten", PUNKTE.schnell180);
  if(S.geloest[0]===3) add("Stufe 4 zuerst", PUNKTE.lilaZuerst);

  // Fehler: die letzten beiden Kategorien wiegen schwerer
  var offen=4, strafe=0, spaet=0;
  S.versuche.forEach(function(v){
    if(v[0]==="t"){ offen--; }
    else { if(offen<=2){ strafe+=PUNKTE.fehlerSpaet; spaet++; } else { strafe+=PUNKTE.fehler; } }
  });
  var frueh=S.fehler-spaet;
  if(frueh) add(frueh+"× Fehler", frueh*PUNKTE.fehler, true);
  if(spaet) add(spaet+"× Fehler (nur noch 2 offen)", spaet*PUNKTE.fehlerSpaet, true);

  if(S.nabelZuletztZaehler===4) add("Nabelwort immer zuletzt getippt", PUNKTE.nabelZuletzt, true);

  var serie=serieJetzt(S.nr);
  if(serie>0) add("Serie: "+serie+" Tage", serie);
  if(S.modus==="leicht") { var ab=-Math.round(summe*0.25); add("Leicht-Modus (−25 %)", ab, true); }

  if(summe<0) summe=0;
  return {zeilen:zeilen, summe:summe, serie:serie};
}

    el.style.setProperty("--rot",(Math.random()*540-270)+"deg");
    document.body.appendChild(el);
    setTimeout(function(n){ return function(){ n.remove(); }; }(el),950);
  }
});

function setzeWelt(w){
  welt=w; LS.setz("vmd.welt",w);

}
function zeigeStart(){
  Array.prototype.forEach.call($("start").querySelectorAll("[data-welt]"),function(b){
    b.setAttribute("aria-current", b.dataset.welt===welt);
  });
  schliesse(); $("start").classList.add("open");
}
Array.prototype.forEach.call(document.querySelectorAll("#start [data-welt]"),function(b){
  b.addEventListener("click",function(){ setzeWelt(b.dataset.welt); });
});
